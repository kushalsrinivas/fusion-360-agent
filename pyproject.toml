[project]
name = "fusion-ai-cad-agent"
version = "0.1.0"
description = "Terminal-based agentic CAD system: LangGraph orchestration + Fusion 360 MCP execution"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.60",
    "textual>=0.86.0",
    "rich>=13.7",
    "openai>=1.50",
    "mcp>=1.12,<1.17",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
fusion-ai = "app.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
