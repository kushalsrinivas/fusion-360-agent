name: Feature request
description: Suggest an improvement to the agent, tooling, or documentation
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. Focused
        requests are easier to evaluate and implement.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change, and which part of the project does it touch?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other designs you have considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Requirements / planning
        - Fusion bridge / MCP
        - Tool registry / executor
        - Inspector / repair
        - TUI
        - Storage / history
        - Documentation
        - Other
    validations:
      required: true
